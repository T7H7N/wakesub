<svg xmlns="http://www.w3.org/2000/svg" width="390" height="452" viewBox="0 0 390 452" role="img" aria-labelledby="t d">
  <title id="t">Three subscriptions across four polls</title>
  <desc id="d">Registered at 09:00, the three watches wait independently. Polls write notices for an empty file at 09:01, a nonempty file at 09:02, and a timer at 09:03.</desc>
  <rect x="1" y="1" width="388" height="450" rx="15" fill="#f6f5f1" stroke="#bcc9c3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172529">
    <text x="20" y="37" font-size="23" font-weight="700">When each subscription fires</text>
    <text x="20" y="64" font-size="14.5" fill="#465a56">Example poll interval: one minute.</text>
    <path d="M20 80h350" stroke="#bdc9c3"/>
    <path d="M90 115v256" stroke="#225a56" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#225a56" stroke-width="1.3"><path d="M87 138h6m-6 18h6m-6 18h6m-6 51h6m-6 18h6m-6 18h6m-6 51h6m-6 18h6m-6 18h6"/></g>
    <g fill="#465a56" font-family="Consolas, 'Courier New', monospace" font-size="15.5"><text x="20" y="120">09:00</text><text x="20" y="208">09:01</text><text x="20" y="295">09:02</text><text x="20" y="382">09:03</text></g>
    <circle cx="90" cy="115" r="7" fill="#f6f5f1" stroke="#225a56" stroke-width="2.8"/>
    <g fill="#b74432" stroke="#f9dfd4" stroke-width="4"><circle cx="90" cy="203" r="9"/><circle cx="90" cy="290" r="9"/><circle cx="90" cy="377" r="9"/></g>
    <g stroke="white" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m86.5 203 2.5 2.4 4.6-4.7m-7.1 89.3 2.5 2.4 4.6-4.7m-7.1 89.3 2.5 2.4 4.6-4.7"/></g>
    <g font-size="18" font-weight="700"><text x="111" y="121">Register three subscriptions</text><text x="111" y="209">Empty file appears</text><text x="111" y="296">File gains content</text><text x="111" y="383">Scheduled time arrives</text></g>
    <g font-size="14.5" fill="#465a56"><text x="111" y="144">Each stays open until its match.</text><text x="111" y="252">File notice written to inbox.</text><text x="111" y="339">Content notice written to inbox.</text><text x="111" y="426">Timer notice written to inbox.</text></g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#783323"><text x="111" y="231">--file report.md</text><text x="111" y="318">--file-nonempty report.md</text><text x="111" y="405">--at 09:03</text></g>
  </g>
</svg>
