<svg xmlns="http://www.w3.org/2000/svg" width="870" height="124" viewBox="0 0 870 124" role="img" aria-labelledby="title desc"><title id="title">wakesub workflow</title><desc id="desc">A subscription is polled outside the session. A matching condition sends a notice through the configured adapter.</desc><g font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="870" height="124" rx="14" fill="#101B2C" stroke="none"/><rect x="18" y="21" width="257" height="82" rx="12" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(42 46)"><path d="M-8 -7h15 M-8 0h15 M-8 7h10" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="63" y="53" font-size="21" fill="#F3F6F8" font-weight="650" >Subscription</text><text x="33" y="86" font-size="16" fill="#CED9E3" font-weight="400" >Time, file, or previous wake</text><path d="M275 62 H299" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M293 57 l6 5 -6 5" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="304" y="21" width="257" height="82" rx="12" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(328 46)"><path d="M-11 0q11 -15 22 0q-11 15 -22 0z M0 -3a3 3 0 1 1 -.1 0" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="349" y="53" font-size="21" fill="#F3F6F8" font-weight="650" >External poller</text><text x="319" y="86" font-size="16" fill="#CED9E3" font-weight="400" >Observe the condition</text><path d="M561 62 H585" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M579 57 l6 5 -6 5" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="590" y="21" width="257" height="82" rx="12" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(614 46)"><path d="M-9 6h18l-3 -4v-4a6 6 0 0 0 -12 0v4z M-3 10h6" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="635" y="53" font-size="21" fill="#F3F6F8" font-weight="650" >Delivery adapter</text><text x="605" y="86" font-size="16" fill="#CED9E3" font-weight="400" >Local command or inbox</text></g></svg>
