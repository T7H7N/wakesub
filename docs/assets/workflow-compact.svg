<svg xmlns="http://www.w3.org/2000/svg" width="416" height="204" viewBox="0 0 416 204" role="img" aria-labelledby="title desc"><title id="title">wakesub workflow</title><desc id="desc">A subscription is polled outside the session. A matching condition sends a notice through the configured adapter.</desc><g font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="416" height="204" rx="14" fill="#101B2C" stroke="none"/><rect x="13" y="11" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 39)"><path d="M-8 -7h15 M-8 0h15 M-8 7h10" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="35" font-size="18" fill="#F3F6F8" font-weight="650" >Subscription</text><text x="60" y="55" font-size="14" fill="#CED9E3" font-weight="400" >Register a time, a file, or a previous wake.</text><path d="M36 68 v4" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="13" y="73" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 101)"><path d="M-11 0q11 -15 22 0q-11 15 -22 0z M0 -3a3 3 0 1 1 -.1 0" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="97" font-size="18" fill="#F3F6F8" font-weight="650" >External poller</text><text x="60" y="117" font-size="14" fill="#CED9E3" font-weight="400" >Check the condition outside the session.</text><path d="M36 130 v4" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="13" y="135" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 163)"><path d="M-9 6h18l-3 -4v-4a6 6 0 0 0 -12 0v4z M-3 10h6" fill="none" stroke="#FFA9B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="159" font-size="18" fill="#F3F6F8" font-weight="650" >Delivery adapter</text><text x="60" y="179" font-size="14" fill="#CED9E3" font-weight="400" >Send a notice by local command or inbox.</text></g></svg>
